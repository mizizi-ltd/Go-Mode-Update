<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="jungleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C2B" />
      <stop offset="100%" stop-color="#1b5e46" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#F2C572" />
    </linearGradient>
    <!-- Drop Shadow for fun native app vibe -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Group containing Logo Icon and Text -->
  <g id="logoContent">
    <!-- Bajaj Tuk-Tuk / Leaf Hybrid Icon -->
    <g transform="translate(10, 10)" filter="url(#shadow)">
      <!-- Outer Leaf / Shield Shape -->
      <path d="M 50,0 C 75,25 90,55 80,85 C 70,105 50,100 50,100 C 50,100 30,105 20,85 C 10,55 25,25 50,0 Z" fill="url(#jungleGradient)" />
      
      <!-- Inside Bajaj Stylized Shape -->
      <!-- Windshield -->
      <path d="M 35,35 Q 50,28 65,35 L 68,52 Q 50,55 32,52 Z" fill="#EBF9F5" opacity="0.9" />
      
      <!-- Headlights & Gold Grill -->
      <rect x="34" y="58" width="32" height="15" rx="3" fill="url(#goldGradient)" />
      <circle cx="40" cy="65" r="5" fill="#FFFFFF" />
      <circle cx="60" cy="65" r="5" fill="#FFFFFF" />
      
      <!-- Front Wheel -->
      <rect x="46" y="78" width="8" height="12" rx="2" fill="#2d3748" />
    </g>

    <!-- Brand Typography -->
    <!-- MIZIZI Title -->
    <text x="115" y="65" font-family="'Outfit', 'Inter', 'Helvetica Neue', sans-serif" font-weight="900" font-size="44" fill="#0B3C2B" letter-spacing="4">MIZIZI</text>
    
    <!-- BAJAJ ADVENTURES Subtitle -->
    <text x="115" y="92" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="14" fill="#E5A93C" letter-spacing="5.5">BAJAJ ADVENTURES</text>
  </g>
</svg>
